<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='320' viewBox='0 0 1200 320' role='img' aria-label='JalaliKit banner'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#0f1a1f'/><stop offset='1' stop-color='#143038'/></linearGradient>
    <linearGradient id='ac' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#f4b942'/><stop offset='1' stop-color='#2ec4b6'/></linearGradient>
    <pattern id='cells' x='107' y='136' width='30' height='30' patternUnits='userSpaceOnUse'><rect x='4' y='4' width='22' height='22' rx='6' fill='#223640'/></pattern>
  </defs>
  <style>
    text { font-family: JetBrains Mono, Fira Code, Consolas, Courier New, monospace; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: scale(.85); opacity: .75; } to { transform: scale(1.12); opacity: 1; } }
    .glow { animation: glow 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes glow { from { opacity: .2; transform: scale(.9); } to { opacity: .6; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none; } }
  </style>
  <rect width='1200' height='320' rx='24' fill='url(#bg)'/>
  <circle class='glow' cx='1090' cy='60' r='95' fill='#f4b942' opacity='.22'/>
  <circle class='glow' cx='1120' cy='270' r='60' fill='#2ec4b6' opacity='.2'/>

  <rect x='90' y='40' width='240' height='240' rx='22' fill='#15242b' stroke='#f4b942' stroke-opacity='.45' stroke-width='2'/>
  <g text-anchor='middle'>
    <text x='210' y='88' font-size='26' font-weight='700' fill='#e8f1f2'>2026-03-21<animate attributeName='opacity' values='1;1;0;0;1' keyTimes='0;0.42;0.5;0.92;1' dur='6s' repeatCount='indefinite'/></text>
    <text x='210' y='88' font-size='26' font-weight='700' fill='#f4b942'>1405/01/01<animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.42;0.5;0.92;1' dur='6s' repeatCount='indefinite'/></text>
    <text x='210' y='112' font-size='14' fill='#8aa4ab'>Gregorian<animate attributeName='opacity' values='1;1;0;0;1' keyTimes='0;0.42;0.5;0.92;1' dur='6s' repeatCount='indefinite'/></text>
    <text x='210' y='112' font-size='14' fill='#2ec4b6'>Jalali (Nowruz)<animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.42;0.5;0.92;1' dur='6s' repeatCount='indefinite'/></text>
  </g>
  <rect x='107' y='136' width='210' height='150' fill='url(#cells)'/>
  <rect class='pulse' x='137' y='140' width='22' height='22' rx='6' fill='#f4b942'/>

  <text x='390' y='150' font-size='76' font-weight='700' fill='url(#ac)' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>JalaliKit</text>
  <text x='392' y='200' font-size='28' fill='#d3e4e6' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Shamsi and Gregorian, done right.</text>
  <text x='392' y='245' font-size='20' fill='#6f9097'>Convert  •  Calendar  •  Days between  •  Tested</text>
</svg>
